name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests with line and branch coverage (fails under 70 %)
        run: >
          pytest -v --cov=app --cov=src --cov-branch
          --cov-report=term --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json
          --cov-report=html:reports/htmlcov --junitxml=reports/junit.xml --cov-fail-under=70

      - name: Generate the four test reports (unit, system validation, code coverage, branch coverage)
        if: always()
        run: |
          cp docs/reports/perf-summary.md reports/ 2>/dev/null || true
          python scripts/generate_reports.py reports reports/generated

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
          retention-days: 30

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check IDs, image links and attribution in docs
        run: python scripts/check_docs.py
